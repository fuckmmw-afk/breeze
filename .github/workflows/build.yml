name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SING_BOX_VERSION: v1.12.25

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Libbox
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-${{ env.SING_BOX_VERSION }}-ios-v2-port

      - name: Checkout sing-box
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_VERSION }}
          path: sing-box

      - name: Setup Go
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '~1.24.10'
          cache-dependency-path: sing-box/go.sum

      - name: Patch Libbox command port
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          # tvOS-mode command channel uses a fixed 127.0.0.1:8964; make it configurable
          cat > sing-box/experimental/libbox/breeze_port.go <<'GO'
          package libbox

          import "strconv"

          var sCommandPort int32 = 8964

          // SetCommandServerPort selects the loopback port of the command channel (tvOS mode).
          func SetCommandServerPort(port int32) {
          	if port > 0 && port < 65536 {
          		sCommandPort = port
          	}
          }

          func commandServerAddress() string {
          	return "127.0.0.1:" + strconv.Itoa(int(sCommandPort))
          }
          GO
          sed -i '' 's/"127.0.0.1:8964"/commandServerAddress()/' sing-box/experimental/libbox/command_client.go sing-box/experimental/libbox/command_server.go
          grep -n "commandServerAddress" sing-box/experimental/libbox/*.go
          test "$(grep -c 'commandServerAddress()' sing-box/experimental/libbox/command_client.go sing-box/experimental/libbox/command_server.go | awk -F: '{s+=$2} END {print s}')" = "2"

      - name: Build Libbox
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          mkdir -p ../Frameworks
          mv Libbox.xcframework ../Frameworks/

      - name: Download rule-sets
        run: |
          cd BreezeKit/Resources/rules
          for name in geosite-category-ads-all geosite-category-ru geosite-yandex geosite-vk; do
            curl -fsSL --retry 3 -o $name.srs https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/$name.srs
          done
          curl -fsSL --retry 3 -o geoip-ru.srs https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-ru.srs
          ls -la

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project Breeze.xcodeproj \
            -scheme Breeze \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Error summary
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Embed entitlements (ad-hoc)
        run: |
          # re-signers that keep the binary's entitlements need them present in the IPA
          APP=build/dd/Build/Products/Release-iphoneos/Breeze.app
          codesign -f -s - $APP/Frameworks/BreezeKit.framework
          codesign -f -s - --entitlements BreezeTunnel/BreezeTunnel.entitlements $APP/PlugIns/BreezeTunnel.appex
          codesign -f -s - --entitlements BreezeWidgets/BreezeWidgets.entitlements $APP/PlugIns/BreezeWidgets.appex
          codesign -f -s - --entitlements Breeze/Breeze.entitlements $APP
          codesign -d --entitlements - --xml $APP/PlugIns/BreezeTunnel.appex | plutil -p - || true
          codesign -d --entitlements - --xml $APP | plutil -p - || true

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Breeze.app dist/Payload/
          cd dist && zip -qry Breeze-unsigned.ipa Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: breeze-ipa
          path: dist/Breeze-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
